[package]
name = "command-manager"
version = "0.3.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[[bin]]
name = "command-manager"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
ui-tests = ["desktop", "gpui/test-support"]
desktop = ["dep:gpui", "dep:gpui_platform", "dep:gpui-component", "dep:gpui-component-assets", "dep:global-hotkey", "dep:tray-icon", "dep:rfd", "dep:raw-window-handle"]

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", optional = true }
gpui_platform = { git = "https://github.com/Kuddev/zed", rev = "1e716d16ec54b361499931b4278903cdcaae8949", version = "=0.1.0", features = ["font-kit"], optional = true }
gpui-component = { version = "=0.5.2", optional = true }
gpui-component-assets = { version = "=0.5.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = { version = "0.8.0", optional = true }
tray-icon = { version = "=0.25.1", optional = true }
rfd = { version = "0.15", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "=3.0.12"

[patch.crates-io]
gpui = { git = "https://github.com/Kuddev/zed", rev = "1e716d16ec54b361499931b4278903cdcaae8949", version = "=0.2.2" }
gpui-component = { git = "https://github.com/Kuddev/gpui-component", rev = "78e1d0c48867f69fec297d9016f48b0ce1b8c146", version = "=0.5.2" }
gpui-component-assets = { git = "https://github.com/Kuddev/gpui-component", rev = "78e1d0c48867f69fec297d9016f48b0ce1b8c146", version = "=0.5.1" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
